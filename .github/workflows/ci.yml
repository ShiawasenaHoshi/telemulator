name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/shiawasenahoshi/telemulator
  PYTHON_VERSION: "3.12"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Syntax check
        run: python -m compileall -q telemulator

      - name: Tests
        run: pytest -n 2 -q

  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # The suite runs from a checkout, where catalog.json and web/ are found
      # by accident. This job is the one that proves an installed package works.
      - name: Build the wheel
        run: pip wheel --no-deps -w dist .

      - name: Install it into a clean environment
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/telemulator-*.whl

      - name: Use it
        run: |
          /tmp/check/bin/python -c "
          from telemulator import create_app
          from telemulator.catalog import load_catalog, catalog_version
          create_app()
          assert load_catalog(), 'empty method catalog'
          print('catalog', catalog_version(), len(load_catalog()), 'methods')
          "

  docker:
    needs: [test, wheel]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
