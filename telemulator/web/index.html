<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>telemulator</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <header class="side-head">
        <div class="brand">telemulator</div>
        <select id="account"></select>
      </header>
      <form id="new-user">
        <input name="first_name" placeholder="Person name" required>
        <button type="submit">Person</button>
      </form>
      <form id="new-bot">
        <input name="token" placeholder="123456:token" required>
        <input name="first_name" placeholder="Bot name" value="Bot">
        <button type="submit">Bot</button>
      </form>
      <form id="new-group">
        <input name="title" placeholder="Group title" required>
        <input name="member_ids" placeholder="ids, comma-separated">
        <button type="submit">Group</button>
      </form>
      <form id="new-channel">
        <input name="title" placeholder="Channel title" required>
        <input name="member_ids" placeholder="ids, comma-separated">
        <button type="submit">Channel</button>
      </form>
      <ul id="chats"></ul>
    </aside>
    <main id="chat">
      <header id="chat-head">Select a chat</header>
      <section id="members" hidden>
        <ul id="member-list"></ul>
        <form id="add-member">
          <input name="user_id" placeholder="member id" required>
          <label><input type="checkbox" id="add-as-admin"> admin</label>
          <button type="submit">Add</button>
        </form>
      </section>
      <div id="feed"></div>
      <div id="reply-kb" hidden></div>
      <form id="composer">
        <input id="draft" autocomplete="off" placeholder="Message">
        <button type="submit">Send</button>
      </form>
    </main>
  </div>
  <section id="debug">
    <h2>Bot API</h2>
    <div id="debug-holes"></div>
    <div id="debug-calls"></div>
  </section>
  <script src="/app.js"></script>
</body>
</html>
