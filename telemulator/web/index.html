<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>telemulator</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <header class="side-head">
        <div class="brand">telemulator</div>
        <select id="account"></select>
      </header>
      <form id="new-user">
        <input name="first_name" placeholder="Имя человека" required>
        <button type="submit">Человек</button>
      </form>
      <form id="new-bot">
        <input name="token" placeholder="123456:token" required>
        <input name="first_name" placeholder="Имя бота" value="Bot">
        <button type="submit">Бот</button>
      </form>
      <form id="new-group">
        <input name="title" placeholder="Название группы" required>
        <input name="member_ids" placeholder="id через запятую">
        <button type="submit">Группа</button>
      </form>
      <form id="new-channel">
        <input name="title" placeholder="Название канала" required>
        <input name="member_ids" placeholder="id через запятую">
        <button type="submit">Канал</button>
      </form>
      <ul id="chats"></ul>
    </aside>
    <main id="chat">
      <header id="chat-head">Выберите чат</header>
      <section id="members" hidden>
        <ul id="member-list"></ul>
        <form id="add-member">
          <input name="user_id" placeholder="id участника" required>
          <label><input type="checkbox" id="add-as-admin"> админ</label>
          <button type="submit">Добавить</button>
        </form>
      </section>
      <div id="feed"></div>
      <div id="reply-kb" hidden></div>
      <form id="composer">
        <input id="draft" autocomplete="off" placeholder="Сообщение">
        <button type="submit">Отправить</button>
      </form>
    </main>
  </div>
  <section id="debug">
    <h2>Bot API</h2>
    <div id="debug-holes"></div>
    <div id="debug-calls"></div>
  </section>
  <script src="/app.js"></script>
</body>
</html>
